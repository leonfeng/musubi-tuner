# Krea 2 LoRA dataset config for musubi-tuner
# Use with: --dataset_config configs/krea2.toml
#
# Single 1024px bucket; enable_bucket resizes/crops images to musubi-tuner buckets.
# Re-run krea2_cache_latents.py and krea2_cache_text_encoder_outputs.py after changing layout.

[general]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
image_directory = "dataset"
cache_directory = "cache"
resolution = 1024
num_repeats = 4
