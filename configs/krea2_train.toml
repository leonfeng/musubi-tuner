# Krea 2 LoRA training config for musubi-tuner (DGX Spark / GB10, 128 GB unified memory)
# Use with: train_krea2_lora.sh  (or accelerate launch ... --config_file configs/krea2_train.toml)
#
# Memory model on DGX Spark:
#   - fp8_base + fp8_scaled: ~half DiT weight footprint (required pair for K2)
#   - gradient_checkpointing: essential for 1280/1536px bucket training (stores one block of
#     activations at a time instead of all 28)
#   - turbo_dit sampling cannot be combined with blocks_to_swap; fp8 + GC is enough on 128 GB
#   - turbo_dit uses streaming (not turbo_dit_cache) to avoid a second full DiT in CPU RAM
#
# If you still OOM, try in order:
#   1. Raise sample_every_n_epochs (e.g. 8) or comment out sample_prompts / turbo_dit / text_encoder
#   2. Drop the 1536 tier from configs/krea2.toml
#   3. Remove turbo_dit and add: blocks_to_swap = 8, block_swap_h2d_only = true

dit = "models/raw.safetensors"
vae = "models/qwen_image_vae.safetensors"
dataset_config = "configs/krea2.toml"

[network]
network_module = "networks.lora_krea2"
network_dim = 32
network_alpha = 32

[optimizer]
optimizer_type = "AdamW8bit"
learning_rate = 1e-4
max_grad_norm = 1.0

[training]
sdpa = true
split_attn = false
# Compiles the 28 main DiT blocks; first epoch is slower while kernels are built.
compile = true
mixed_precision = "bf16"
# Critical for multi-resolution training up to 1536px (docs default; was false -> OOM).
gradient_checkpointing = true
# Halves DiT weight memory; both flags are required for K2 (see docs/krea2.md).
fp8_base = true
fp8_scaled = true
# Fewer workers = less pinned host memory on unified-memory GB10.
max_data_loader_n_workers = 1
persistent_data_loader_workers = false
max_train_epochs = 16
save_every_n_epochs = 1
seed = 42

[timestep]
# krea2_shift matches K2's resolution-aware schedule (recommended with bucket training)
timestep_sampling = "krea2_shift"
weighting_scheme = "none"
discrete_flow_shift = 2.5

[output]
output_dir = "output"
output_name = "greg_rutkowski_v4_krea2"

# Sample generation during training (disabled — train only).
